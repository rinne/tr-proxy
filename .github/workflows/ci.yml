name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Formatting and vet
        run: make check
      - name: Go tests
        run: make test
      - name: Go tests with the race detector
        run: make race
      - name: Known vulnerabilities
        run: make vulncheck
      - name: Smoke test (image)
        run: tests/smoke.sh
